<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121212">
<title>ChessDojo Metrics</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ChessDojo design system (dark only, as the site). Names follow its tokens. */
  :root {
    color-scheme: dark;
    --cd-app-background: #121212;
    --cd-surface-cards: #272727;
    --cd-surface-raised: #333333;        /* hover / pressed: one more white overlay step */
    --cd-white: #ffffff;
    --cd-text-secondary: rgba(255, 255, 255, 0.7);
    --cd-text-muted: rgba(255, 255, 255, 0.6);
    --cd-divider: rgba(255, 255, 255, 0.12);
    --cd-grid: rgba(255, 255, 255, 0.08);
    --cd-dojo-orange: #f7931e;
    --cd-orange-wash: rgba(247, 147, 30, 0.10);
    --cd-orange-soft: rgba(247, 147, 30, 0.45);
    --cd-link-primary: #90caf9;
    --cd-success-green: #66bb6a;
    --cd-error-timer-red: #f44336;
    --focus-ring: 0 0 0 2px #121212, 0 0 0 4px #90caf9;
    --radius-sm: 4px;
    --radius-pill: 16px;
    --font: Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cd-app-background);
    color: var(--cd-white);
    font: 400 16px/24px var(--font);
    letter-spacing: 0.00938em;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; }

  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin-bottom: 32px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 56px; height: auto; display: block; }
  .overline { font-size: 12px; line-height: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cd-text-secondary); font-weight: 500; }
  h1 { margin: 0; font-size: 40px; line-height: 48px; font-weight: 700; }
  .meta { color: var(--cd-text-secondary); font-size: 14px; line-height: 20px; text-align: right; }
  .meta strong { color: var(--cd-white); font-weight: 500; }

  .card { background: var(--cd-surface-cards); border-radius: var(--radius-sm); }

  .hero { display: grid; grid-template-columns: minmax(240px, 1fr) 2fr; margin-bottom: 32px; overflow: hidden; border-top: 3px solid var(--cd-dojo-orange); }
  .hero-main { padding: 24px; border-right: 1px solid var(--cd-divider); }
  .hero-label { font-size: 14px; line-height: 20px; color: var(--cd-text-secondary); font-weight: 500; }
  .hero-value { font-size: 64px; line-height: 1; font-weight: 700; margin: 8px 0 12px; }
  .hero-note { font-size: 12px; line-height: 20px; color: var(--cd-text-muted); margin-top: 8px; }
  .hero-split .v.missing { color: var(--cd-text-muted); }
  .tile-unit { font-size: 14px; font-weight: 500; color: var(--cd-text-secondary); margin-left: 8px; }
  .hero-split { display: grid; grid-template-columns: repeat(3, 1fr); }
  .hero-split > div { padding: 24px 20px; border-right: 1px solid var(--cd-divider); }
  .hero-split > div:last-child { border-right: 0; }
  .hero-split .v { font-size: 32px; line-height: 40px; font-weight: 700; margin: 4px 0; }

  .badge { display: inline-grid; place-items: center; flex: none; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
  .badge svg { display: block; }
  h2, .tile-label, .hero-label { display: flex; align-items: center; gap: 10px; }
  .tile-label { gap: 8px; }
  section.group { margin-bottom: 32px; }
  .group-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin: 0 0 12px; }
  h2 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 700; }
  .group-note { font-size: 12px; line-height: 20px; color: var(--cd-text-muted); letter-spacing: 0.03333em; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

  .tile { border: 1px solid transparent; padding: 16px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; transition: background-color .15s, border-color .15s; }
  .tile:hover { background: var(--cd-surface-raised); }
  .tile:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .tile.active { border-color: var(--cd-dojo-orange); }
  .tile-label { font-size: 14px; line-height: 20px; color: var(--cd-text-secondary); font-weight: 500; }
  .tile-value { font-size: 32px; line-height: 40px; font-weight: 700; }
  .tile-value.missing { color: var(--cd-text-muted); }
  .tile-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .tile-foot { min-height: 20px; }
  .delta { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--cd-white); }
  .delta .arrow { font-size: 11px; margin-right: 2px; }
  .delta.good .arrow { color: var(--cd-success-green); }
  .delta.bad .arrow { color: var(--cd-error-timer-red); }
  .delta .vs { font-weight: 400; color: var(--cd-text-muted); }
  .delta.flat { color: var(--cd-text-muted); font-weight: 400; }
  .badge-error { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 20px; color: var(--cd-white); border: 1px solid var(--cd-error-timer-red); border-radius: var(--radius-pill); padding: 0 10px; }
  .badge-error::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cd-error-timer-red); }
  .spark { width: 88px; height: 30px; flex: none; overflow: visible; margin: 0 4px 8px 0; }

  .chart-card { padding: 24px 24px 16px; margin-bottom: 32px; }
  .chart-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-bottom: 8px; }
  .chart-title { font-size: 20px; line-height: 28px; font-weight: 700; }
  .chart-sub { font-size: 14px; line-height: 20px; color: var(--cd-text-muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select { font: inherit; font-size: 14px; line-height: 20px; color: var(--cd-white); background: var(--cd-app-background); border: 1px solid var(--cd-divider); border-radius: var(--radius-sm); padding: 8px 12px; max-width: 100%; }
  select:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .chip { font: inherit; font-size: 13px; font-weight: 500; letter-spacing: 0.02857em; text-transform: uppercase; line-height: 30px; height: 32px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--cd-divider); background: transparent; color: var(--cd-text-secondary); cursor: pointer; }
  .chip:hover { background: var(--cd-surface-raised); }
  .chip[aria-pressed="true"] { border-color: var(--cd-link-primary); color: var(--cd-link-primary); }
  .chip:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .chart-box { position: relative; }
  #chart { width: 100%; height: 320px; display: block; }
  .tooltip { position: absolute; pointer-events: none; background: var(--cd-app-background); border: 1px solid var(--cd-divider); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12px; line-height: 18px; white-space: nowrap; opacity: 0; transition: opacity .08s; z-index: 5; }
  .tooltip .tt-date { color: var(--cd-text-muted); }
  .tooltip .tt-val { font-size: 16px; line-height: 24px; font-weight: 700; }
  .tooltip .delta { font-size: 12px; }
  .chart-empty { height: 320px; display: grid; place-items: center; color: var(--cd-text-muted); font-size: 14px; text-align: center; padding: 0 16px; }

  details.table-card { margin-bottom: 32px; }
  details.table-card summary { padding: 16px 24px; cursor: pointer; font-weight: 700; font-size: 20px; line-height: 28px; }
  details.table-card summary:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .table-scroll { overflow-x: auto; border-top: 1px solid var(--cd-divider); }
  table { border-collapse: collapse; font-size: 14px; line-height: 20px; width: 100%; }
  th, td { padding: 10px 16px; border-bottom: 1px solid var(--cd-divider); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  th { font-weight: 500; color: var(--cd-text-secondary); background: var(--cd-surface-cards); }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--cd-surface-cards); }
  td.err { color: var(--cd-text-muted); font-style: italic; }

  .notes { font-size: 14px; line-height: 22px; color: var(--cd-text-secondary); }
  .notes strong { color: var(--cd-white); font-weight: 500; }
  .notes ul { margin: 8px 0 0; padding-left: 20px; }

  .state { padding: 64px 24px; text-align: center; }
  .state h2 { margin-bottom: 8px; }
  .state p { color: var(--cd-text-secondary); max-width: 520px; margin: 0 auto; }
  .demo-banner { border: 1px solid var(--cd-dojo-orange); color: var(--cd-white); border-radius: var(--radius-sm); padding: 8px 16px; font-size: 14px; line-height: 20px; margin-bottom: 24px; }
  .demo-banner b { color: var(--cd-dojo-orange); font-weight: 500; }

  @media (max-width: 760px) {
    .wrap { padding-top: 24px; }
    .hero { grid-template-columns: 1fr; }
    .hero-main { border-right: 0; border-bottom: 1px solid var(--cd-divider); }
    .hero-split > div { padding: 16px; }
    .hero-split .v { font-size: 24px; line-height: 32px; }
    .meta { text-align: left; }
    h1 { font-size: 28px; line-height: 36px; }
    .brand img { width: 44px; }
    .hero-value { font-size: 52px; }
    .chart-card { padding: 16px 16px 8px; }
    .chart-head > div, .chart-head .controls, select { min-width: 0; width: 100%; }
  }
  @media (max-width: 420px) {
    .hero-split { grid-template-columns: 1fr; }
    .hero-split > div { border-right: 0; border-bottom: 1px solid var(--cd-divider); }
    .hero-split > div:last-child { border-bottom: 0; }
  }
</style>
</head>

function iconBadge(id, size) {
  const ic = ICONS[id];
  if (!ic) return '';
  const s = size || 28;
  return `<span class="badge" style="width:${s}px;height:${s}px;background:${ic.bg}" title="${esc(ic.name)}" aria-hidden="true"><svg viewBox="${ic.vb || '0 0 24 24'}" fill="${ic.fg || '#fff'}" style="width:${Math.round(s * (ic.pad ? 0.72 : 0.58))}px;height:${Math.round(s * (ic.pad ? 0.72 : 0.58))}px"><path d="${ic.path}"/></svg></span>`;
}

// ---------- State ----------
const state = { rows: [], metric: 'dojo_members', range: 'all', demo: false };

// ---------- Formatting ----------
const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
function fmt(v, kind) {
  if (v == null) return '—';
  if (kind === 'pct') return nf1.format(v) + '%';
  if (kind === 'dec') return nf1.format(v);
  return nf0.format(v);
}
function compact(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return +(v / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1e3) return +(v / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'K';
  return String(+v.toFixed(1));
}
function fmtDate(iso, long) {
  const d = new Date(iso + 'T12:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', long ? { month: 'long', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric' });
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- Data ----------
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function toRecords(table) {
  return table.slice(1)
    .filter(r => r[0] && /^\d{4}-\d{2}-\d{2}/.test(r[0].trim()))
    .map(r => {
      const rec = { date: r[0].trim().slice(0, 10), errors: {} };
      COLUMNS.slice(1).forEach((key, i) => {
        const raw = (r[i + 1] || '').trim();
        if (raw.toUpperCase() === 'ERROR') { rec[key] = null; rec.errors[key] = true; return; }
        const n = parseFloat(raw.replace(/[,%\s]/g, ''));
        rec[key] = raw === '' || isNaN(n) ? null : n;
      });
      return withDerived(rec);
    })
    .sort((a, b) => a.date.localeCompare(b.date));
}

function withDerived(rec) {
  const parts = [rec.stripe_basic, rec.stripe_workshop, rec.stripe_live];
  rec.stripe_paying = parts.every(v => v != null) ? parts.reduce((a, b) => a + b, 0) : null;
  return rec;
}

function sheetUrl() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('csv')) return p.get('csv');
  if (p.has('k')) return `https://docs.google.com/spreadsheets/d/e/${encodeURIComponent(p.get('k'))}/pub?gid=${encodeURIComponent(p.get('gid') || '0')}&single=true&output=csv`;
  return null;
}

    out.push({

// ---------- Helpers ----------
const last = () => state.rows[state.rows.length - 1];
const prev = () => state.rows[state.rows.length - 2];
function rawSeries(key) { return state.rows.filter(r => r[key] != null).map(r => ({ date: r.date, v: r[key] })); }
/** All-time metrics chart as change per row; everything else as stored. */
function series(key) {
  const raw = rawSeries(key);
  if (!METRICS[key].allTime) return raw;
  return raw.slice(1).map((p, i) => ({ date: p.date, v: p.v - raw[i].v, since: raw[i].date }));
}
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); }
function periodLabel(from, to) { return daysBetween(from, to) === 7 ? 'this week' : `since ${fmtDate(from)}`; }
function signed(v) { return (v > 0 ? '+' : v < 0 ? '−' : '') + nf0.format(Math.abs(v)); }

function deltaHtml(key, cur, before, prevDate) {
  const m = METRICS[key] || { fmt: 'int', better: 'up' };
  if (cur == null || before == null) return '';
  const d = cur - before;
  const rounded = m.fmt === 'int' ? Math.round(d) : Math.round(d * 10) / 10;
  if (rounded === 0) return `<span class="delta flat">No change <span class="vs">vs ${fmtDate(prevDate)}</span></span>`;
  const good = m.better === 'up' ? d > 0 : d < 0;
  const arrow = d > 0 ? '▲' : '▼';
  let txt = (d > 0 ? '+' : '−') + (m.fmt === 'pct' ? nf1.format(Math.abs(d)) + ' pts' : m.fmt === 'dec' ? nf1.format(Math.abs(d)) : nf0.format(Math.abs(d)));
  if (m.fmt === 'int' && before) txt += ` (${d > 0 ? '+' : '−'}${nf1.format(Math.abs(d / before * 100))}%)`;
  return `<span class="delta ${good ? 'good' : 'bad'}"><span class="arrow" aria-hidden="true">${arrow}</span> ${txt} <span class="vs">vs ${fmtDate(prevDate)}</span></span>`;
}

function sparkSvg(key) {
  const pts = series(key).slice(-12);
  if (pts.length < 2) return '';
  const W = 96, H = 32, pad = 4;
  const vals = pts.map(p => p.v); const min = Math.min(...vals), max = Math.max(...vals); const span = max - min || 1;
  const x = i => pad + i * (W - 2 * pad) / (pts.length - 1);
  const y = v => H - pad - (v - min) / span * (H - 2 * pad);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const lx = x(pts.length - 1), ly = y(vals[vals.length - 1]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--cd-orange-soft)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="4" fill="var(--cd-dojo-orange)" stroke="var(--cd-surface-cards)" stroke-width="2"/></svg>`;
}

// ---------- Render ----------
function render() {
  const app = document.getElementById('app');
  const meta = document.getElementById('meta');

  if (!state.rows.length) {
    meta.innerHTML = 'Updated every Friday, 10:00 AM ET';
    app.innerHTML = `<div class="card state"><h2>The first weekly row isn't in yet</h2><p>The sheet fills itself every Friday at 10:00 AM US Eastern. Check back after the next run.</p></div>`;
    return;
  }

  const L = last(), P = prev();
  meta.innerHTML = `Week of <strong>${fmtDate(L.date, true)}</strong><br>${state.rows.length} week${state.rows.length > 1 ? 's' : ''} of data · updated Fridays, 10:00 AM ET`;

  const heroSplit = [['stripe_paying', 'stripe'], ['wix_subscribers', null], ['dojo_active', null]].map(([k, icon]) => `
      <div><div class="hero-label">${icon ? iconBadge(icon, 20) : ''}<span>${esc(METRICS[k].label)}</span></div>
        ${L[k] == null && METRICS[k].optional ? '<div class="v missing">—</div><span class="delta flat">Not entered yet</span>'
          : `<div class="v">${fmt(L[k])}</div>${P ? deltaHtml(k, L[k], P[k], P.date) : ''}`}</div>`).join('');

  let html = state.demo ? `<div class="demo-banner"><b>Demo mode.</b> Made-up numbers to preview the layout. Real data loads from the sheet link.</div>` : '';
  html += `
    <div class="card hero">
      <div class="hero-main">
        <div class="hero-label">${iconBadge('chessdojo', 24)}<span>Training Program members (chessdojo.club)</span></div>
        <div class="hero-value">${fmt(L.dojo_members)}</div>
        ${P ? deltaHtml('dojo_members', L.dojo_members, P.dojo_members, P.date) : '<span class="delta flat">Week-over-week change shows from the second week</span>'}
        <div class="hero-note">Active + inactive members on the site, incl. Wix and gifted accounts</div>
      </div>
      <div class="hero-split">${heroSplit}</div>
    </div>`;

  html += `
    <div class="card chart-card">
      <div class="chart-head">
        <div><div class="chart-title" id="chartTitle"></div><div class="chart-sub" id="chartSub"></div></div>
        <div class="controls">
          <label class="sr" for="metricSel" style="position:absolute;left:-9999px">Metric</label>
          <select id="metricSel">${GROUPS.map(g => `<optgroup label="${esc(g.title)}">${g.keys.map(k => `<option value="${k}"${k === state.metric ? ' selected' : ''}>${esc(METRICS[k].label + (METRICS[k].allTime ? ' (per week)' : ''))}</option>`).join('')}</optgroup>`).join('')}</select>
          <div class="controls" role="group" aria-label="Time range">
            ${[['12', '12 weeks'], ['26', '26 weeks'], ['all', 'All']].map(([v, t]) => `<button type="button" class="chip" data-range="${v}" aria-pressed="${state.range === v}">${t}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="chart-box"><svg id="chart" role="img"></svg><div class="tooltip" id="tip"></div></div>
    </div>`;

  GROUPS.forEach(g => {
    html += `<section class="group"><div class="group-head"><h2>${g.icon ? iconBadge(g.icon, 32) : ''}<span>${esc(g.title)}</span></h2>${g.note ? `<span class="group-note">${esc(g.note)}</span>` : ''}</div><div class="tiles">`;
    g.keys.forEach(k => {
      const m = METRICS[k]; const v = L[k];
      if (m.optional && v == null) return;
      const err = L.errors[k];
      let label = m.label, valueHtml, foot;
      if (m.allTime && v != null && P && P[k] != null) {
        // Main number: change since the previous row; the all-time total is the small line.
        valueHtml = `<div class="tile-value">${signed(v - P[k])}<span class="tile-unit">${periodLabel(P.date, L.date)}</span></div>`;
        foot = `<span class="delta flat">All time ${fmt(v)}</span>`;
      } else {
        if (m.allTime) label += ' (all time)';
        valueHtml = v == null ? `<div class="tile-value missing">—</div>` : `<div class="tile-value">${fmt(v, m.fmt)}</div>`;
        foot = m.allTime ? (v == null ? '' : '<span class="delta flat">Weekly change shows from next Friday</span>')
          : (P ? deltaHtml(k, v, P[k], P.date) : '');
      }
      if (err) foot = `<span class="badge-error">Not collected this week</span>`;
      html += `<button type="button" class="card tile${k === state.metric ? ' active' : ''}" data-metric="${k}" aria-label="${esc(label)}: ${v == null ? 'no data' : fmt(v, m.fmt)}. Show trend.">
        <span class="tile-label">${m.icon ? iconBadge(m.icon, 24) : ''}<span>${esc(label)}</span></span>
        <span class="tile-row">${valueHtml}${sparkSvg(k)}</span>
        <span class="tile-foot">${foot}</span></button>`;
    });
    html += `</div></section>`;
  });

  html += `<details class="card table-card"><summary>All weeks (table)</summary><div class="table-scroll"><table>
    <thead><tr><th>Week</th>${COLUMNS.slice(1).map(k => `<th>${esc(METRICS[k].label + (METRICS[k].allTime ? ' (all time)' : ''))}</th>`).join('')}</tr></thead>
    <tbody>${state.rows.slice().reverse().map(r => `<tr><td>${fmtDate(r.date, true)}</td>${COLUMNS.slice(1).map(k => r.errors[k] ? '<td class="err">error</td>' : `<td>${fmt(r[k], METRICS[k].fmt)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div></details>`;

  html += `<div class="notes"><strong>Notes</strong><ul>
    <li>A new row is added every Friday at 10:00 AM US Eastern. Week-over-week changes compare with the previous Friday.</li>
    <li>Search Console data lags 2–3 days, so Friday's numbers cover roughly the week up to Wednesday.</li>
    <li>"Active" on chessdojo.club means active within the past month. YouTube reports subscriber counts rounded.</li>
    <li>About 400 members still pay through Wix (old site). The site only marks Wix cancellations on the 1st of each month or when the user logs in, so the chessdojo.club count can run higher than Stripe + Wix. 25-40 accounts are gifted.</li>
    <li>Rating points, conversions, cancellations and podcast downloads are stored as all-time totals. From the second week the big number is the change since the previous Friday, with the all-time total underneath.</li>
    <li>Stripe members are subscriptions that are active, trialing or past due (card failed, access kept). Canceled, unpaid and incomplete ones are not counted.</li>
    <li>If a source fails on a Friday, that cell shows "Not collected this week" until it's filled in by hand.</li>
  </ul></div>`;

  app.innerHTML = html;

  app.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
    state.metric = t.dataset.metric; render();
    document.querySelector('.chart-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  document.getElementById('metricSel').addEventListener('change', e => { state.metric = e.target.value; render(); });
  app.querySelectorAll('.chip[data-range]').forEach(b => b.addEventListener('click', () => { state.range = b.dataset.range; render(); }));
  drawChart();
}

function drawChart() {
  const svg = document.getElementById('chart');
  const tip = document.getElementById('tip');
  const m = METRICS[state.metric];
  let pts = series(state.metric);
  let title = m.label + (m.allTime ? ', change per week' : '');
  if (m.allTime && pts.length < 2) { pts = rawSeries(state.metric); title = m.label + ' (all time)'; }
  if (state.range !== 'all') pts = pts.slice(-Number(state.range));
  document.getElementById('chartTitle').textContent = title;
  document.getElementById('chartSub').textContent = pts.length
    ? `${pts.length} week${pts.length > 1 ? 's' : ''} · ${fmtDate(pts[0].date)} – ${fmtDate(pts[pts.length - 1].date)}${m.better === 'down' ? ' · lower is better' : ''}`
    : 'No data yet';
  svg.setAttribute('aria-label', `${m.label} by week`);

  if (pts.length < 2) {
    svg.outerHTML = `<div class="chart-empty" id="chart">${pts.length ? `One week so far: ${fmt(pts[0].v, m.fmt)}. The trend line appears from the second week.` : 'No data for this metric yet.'}</div>`;
    return;
  }

  const W = svg.clientWidth || 800, H = 300;
  const padL = 52, padR = 64, padT = 16, padB = 30;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 1; hi += 1; }
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => padL + i * (W - padL - padR) / (pts.length - 1);
  const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);

  let g = '';
  for (let t = lo; t <= hi + step / 2; t += step) {
    const yy = y(t).toFixed(1);
    g += `<line x1="${padL}" x2="${W - padR + 8}" y1="${yy}" y2="${yy}" stroke="var(--cd-grid)" stroke-width="1"/>`;
    g += `<text x="${padL - 8}" y="${yy}" dy="0.32em" text-anchor="end" font-size="11" fill="var(--cd-text-muted)" style="font-variant-numeric:tabular-nums">${tickLabel(t, step, m.fmt)}</text>`;
  }
  const every = Math.max(1, Math.ceil(pts.length / Math.max(2, Math.floor((W - padL - padR) / 70))));
  pts.forEach((p, i) => {
    if (i % every === 0 || i === pts.length - 1) {
      if (i !== pts.length - 1 && pts.length - 1 - i < every * 0.6) return;
      g += `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--cd-text-muted)">${fmtDate(p.date)}</text>`;
    }
  });
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = `${line}L${x(pts.length - 1).toFixed(1)},${y(lo).toFixed(1)}L${x(0).toFixed(1)},${y(lo).toFixed(1)}Z`;
  const lx = x(pts.length - 1), ly = y(vals[vals.length - 1]);
  g += `<path d="${area}" fill="var(--cd-orange-wash)"/>`;
  g += `<path d="${line}" fill="none" stroke="var(--cd-dojo-orange)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<circle cx="${lx}" cy="${ly}" r="4.5" fill="var(--cd-dojo-orange)" stroke="var(--cd-surface-cards)" stroke-width="2"/>`;
  const endVal = vals[vals.length - 1];
  g += `<text x="${lx + 10}" y="${ly}" dy="0.32em" font-size="12" font-weight="700" fill="var(--cd-white)">${m.fmt === 'int' && endVal >= 1e5 ? compact(endVal) : fmt(endVal, m.fmt)}</text>`;
  g += `<line id="xh" y1="${padT}" y2="${H - padB}" stroke="var(--cd-divider)" stroke-width="1" visibility="hidden"/>`;
  g += `<circle id="xdot" r="4.5" fill="var(--cd-dojo-orange)" stroke="var(--cd-surface-cards)" stroke-width="2" visibility="hidden"/>`;
  g += `<rect x="${padL}" y="0" width="${W - padL - padR}" height="${H}" fill="transparent" id="hit"/>`;
  svg.innerHTML = g;

  const hit = svg.querySelector('#hit'), xh = svg.querySelector('#xh'), xdot = svg.querySelector('#xdot');
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const sx = px * (W / r.width);
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((sx - padL) / ((W - padL - padR) / (pts.length - 1)))));
    const cx = x(i), cy = y(pts[i].v);
    xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible');
    xdot.setAttribute('cx', cx); xdot.setAttribute('cy', cy); xdot.setAttribute('visibility', 'visible');
    const before = pts[i - 1];
    tip.innerHTML = `<div class="tt-date">Week of ${fmtDate(pts[i].date, true)}</div><div class="tt-val">${fmt(pts[i].v, m.fmt)}</div>${before ? deltaHtml(state.metric, pts[i].v, before.v, before.date) : ''}`;
    tip.style.opacity = 1;
    const scale = r.width / W;
    let left = cx * scale + 12; const tw = tip.offsetWidth;
    if (left + tw > r.width) left = cx * scale - tw - 12;
    tip.style.left = Math.max(0, left) + 'px';
    tip.style.top = Math.max(0, cy * scale - 30) + 'px';
  };
  const leave = () => { tip.style.opacity = 0; xh.setAttribute('visibility', 'hidden'); xdot.setAttribute('visibility', 'hidden'); };
  hit.addEventListener('mousemove', move); hit.addEventListener('touchmove', move, { passive: true });
  hit.addEventListener('mouseleave', leave); hit.addEventListener('touchend', leave);
}

/** Axis tick text: compact only when the step is coarse enough that compact labels stay distinct. */
function tickLabel(v, step, kind) {
  if (kind === 'pct') return nf1.format(v) + '%';
  if (kind === 'dec') return step < 1 ? nf1.format(v) : nf0.format(v);
  if (step >= 1e6) return +(v / 1e6).toFixed(step % 1e6 ? 1 : 0) + 'M';
  if (step >= 1e3) return +(v / 1e3).toFixed(step % 1e3 ? 1 : 0) + 'K';
  return nf0.format(v);
}

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

// ---------- Boot ----------
(async function init() {
  addEventListener('hashchange', () => location.reload());
  let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => state.rows.length && drawChart(), 150); });
  const app = document.getElementById('app');
  if (location.hash.includes('demo')) {
    state.demo = true; state.rows = demoRows(); render(); return;
  }
  const url = sheetUrl();
  if (!url) {
    document.getElementById('meta').textContent = '';
    app.innerHTML = `<div class="card state"><h2>This link is missing its data key</h2><p>Open the dashboard with the full link you were given (it ends with <code>#k=…</code>).</p></div>`;
    return;
  }
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.rows = toRecords(parseCSV(await res.text()));
    render();
  } catch (e) {
    document.getElementById('meta').textContent = '';
    app.innerHTML = `<div class="card state"><h2>Couldn't load the data</h2><p>The sheet didn't respond (${esc(e.message)}). Try reloading in a minute.</p></div>`;
  }
})();
</script>
</body>
</html>
